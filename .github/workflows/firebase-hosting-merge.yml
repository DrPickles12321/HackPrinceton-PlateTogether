name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        # Node 20's default happy-eyeballs dual-stack connection racing
        # (autoSelectFamily) causes "premature close" drops against Google's
        # APIs on GitHub runners. The release POST succeeds server-side but the
        # non-idempotent retry then fails with "supplied version is the current
        # active version", marking a successful deploy as failed. Disabling
        # family autoselection stops the premature closes at the source.
        env:
          NODE_OPTIONS: --no-network-family-autoselection
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLATETOGETHER_66BEB }}
          channelId: live
          projectId: platetogether-66beb
          firebaseToolsVersion: latest
