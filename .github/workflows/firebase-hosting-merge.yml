name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}
      # We deploy with the Firebase CLI directly instead of
      # FirebaseExtended/action-hosting-deploy. On GitHub runners every Google
      # API call intermittently hits a "premature close" connection drop; the
      # hosting release POST succeeds server-side (the bundle goes live) but the
      # CLI's non-idempotent retry then returns 400 "supplied version is the
      # current active version", which the marketplace action reports as a failed
      # job. Here we tolerate exactly that benign race (the site is already
      # serving the intended content in that case) while still failing on any
      # other error.
      - name: Deploy to Firebase Hosting (live)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLATETOGETHER_66BEB }}
        run: |
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          set +e
          OUT=$(npx -y firebase-tools@latest deploy --only hosting --project platetogether-66beb --non-interactive 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          rm -f "$SA_FILE"
          if [ "$CODE" -eq 0 ]; then
            exit 0
          fi
          if echo "$OUT" | grep -q "is the current active version"; then
            echo "::notice::Release hit the benign 'already active version' retry race; the deploy succeeded and the site is up to date."
            exit 0
          fi
          echo "::error::Firebase deploy failed for a non-benign reason."
          exit "$CODE"
